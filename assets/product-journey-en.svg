<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Choose between SupaCloud Lite and SupaCloud</title>
  <desc id="desc">SupaCloud Lite is for fast local single-project validation. The standard SupaCloud platform is for multi-project production operations, followed by optional admin, access, background work, and WeChat tools.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="12" fill="#f8fafc"/>
  <text x="40" y="42" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Start small, then grow into production</text>
  <text x="40" y="69" fill="#475569" font-family="Arial, sans-serif" font-size="16">Use Lite to prove one idea quickly. Move to the standard platform when you need shared infrastructure and operations.</text>

  <rect x="30" y="94" width="550" height="145" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <rect x="620" y="94" width="550" height="145" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="55" y="128" fill="#047857" font-size="22" font-weight="700">SupaCloud Lite</text>
    <text x="55" y="153" fill="#065f46" font-size="15">Single project &#x2022; Bun-native &#x2022; no Docker</text>
    <text x="55" y="181" fill="#334155" font-size="15">Local-first development and small deployments</text>
    <text x="55" y="207" fill="#334155" font-size="15">REST &#x2022; Auth &#x2022; Storage &#x2022; Realtime &#x2022; Edge Functions</text>

    <text x="645" y="128" fill="#1d4ed8" font-size="22" font-weight="700">SupaCloud</text>
    <text x="645" y="153" fill="#1e40af" font-size="15">Multi-project platform &#x2022; console &#x2022; management API</text>
    <text x="645" y="181" fill="#334155" font-size="15">Production infrastructure on servers you control</text>
    <text x="645" y="207" fill="#334155" font-size="15">PostgreSQL &#x2022; gateway &#x2022; hosting &#x2022; scaling &#x2022; operations</text>
  </g>
  <line x1="580" y1="166" x2="610" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="151" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12">grow</text>

  <text x="40" y="282" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Add these as your product grows</text>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="290" y1="346" x2="315" y2="346"/>
    <line x1="580" y1="346" x2="605" y2="346"/>
    <line x1="870" y1="346" x2="895" y2="346"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <rect x="30" y="302" width="260" height="88" rx="8" fill="#2563eb"/>
    <text x="160" y="337" font-size="19" font-weight="700">svadmin</text>
    <text x="160" y="363" font-size="14">Manage content and users</text>

    <rect x="320" y="302" width="260" height="88" rx="8" fill="#dc2626"/>
    <text x="450" y="337" font-size="19" font-weight="700">supauth</text>
    <text x="450" y="363" font-size="14">Teams, roles, and access</text>

    <rect x="610" y="302" width="260" height="88" rx="8" fill="#d97706"/>
    <text x="740" y="337" font-size="19" font-weight="700">postgresx</text>
    <text x="740" y="363" font-size="14">Caching and background work</text>

    <rect x="900" y="302" width="270" height="88" rx="8" fill="#16a34a"/>
    <text x="1035" y="337" font-size="19" font-weight="700">supabase-mp-js</text>
    <text x="1035" y="363" font-size="14">Reach WeChat users</text>
  </g>
</svg>
